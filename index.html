
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="/js/scripts.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header"></div>
    <main>
        <h1>Welcome to the Fireworks Store in Uppsala</h1>
        <p>Explore our wide range of fireworks and special promotions!</p>
    </main>
    <div id="footer"></div>

    <script>
        // Load header and footer dynamically
        document.getElementById("header").innerHTML = fetch('header.html').then(res => res.text()).then(html => document.getElementById("header").innerHTML = html);
        document.getElementById("footer").innerHTML = fetch('footer.html').then(res => res.text()).then(html => document.getElementById("footer").innerHTML = html);
    </script>
    <script src="js/scripts.js"></script>
</body>
</html>
