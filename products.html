<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Fireworks Store</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="header"></div>

    <main class="container">
        <h2><a href="cart.html"><button>See your cart</button></a></h2>
        <a href="checkout.html"><button>Proceed to Checkout</button></a>
        <h2>Our Products</h2>
        <div class="products">
            <div class="product">
                <img src="images/394-Hellfire41.webp" alt="Hellfire">
                <h3>Hellfire</h3>
                <p>High-impact fireworks for large events.</p>
                <p><strong>4999 sek</strong></p>
                <button onclick="addToCart(1, 'Hellfire', 4999)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="images/352-Big-Thunder-1024x1024.png" alt="Big-Thunder">
                <h3>Big-Thunder</h3>
                <p>Colorful bursts that light up the night sky.</p>
                <p><strong>299 sek</strong></p>
                <button onclick="addToCart(2, 'Big-Thunder', 299)">Add to Cart</button>
            </div>
            <!-- Add more products as needed -->
        </div>
        <h2><a href="cart.html"><button>See your cart</button></a></h2>
        <a href="checkout.html"><button>Proceed to Checkout</button></a>
    </main>

    <div id="footer"></div>

    <script>
        // Load header and footer dynamically
        document.addEventListener("DOMContentLoaded", function () {
            fetch("header.html")
                .then(res => res.text())
                .then(html => document.getElementById("header").innerHTML = html)
                .catch(error => console.error("Error loading header:", error));
    
            fetch("footer.html")
                .then(res => res.text())
                .then(html => document.getElementById("footer").innerHTML = html)
                .catch(error => console.error("Error loading footer:", error));
    
            // Run displayCart() when the page loads
            // displayCart();
        });
    </script>
    <script src="js/scripts.js"></script>
    
    
</body>
</html>
